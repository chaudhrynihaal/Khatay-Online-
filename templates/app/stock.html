<!DOCTYPE html>
<html lang="en">
<head>
  {% include "app/_v2_head.html" %}
  <title>Stock Report · {{ company_name }}</title>
</head>
<body>
  <div id="root"></div>
  <script>
    window.__PAGE__ = {
      {% include "app/_v2_page_data.html" %}
      items: {{ items|tojson }},
      totalValue: {{ total_value|tojson }},
      negativeStockCount: {{ negative_stock_count|tojson }},
      pdfUrl: {{ url_for('report_pdf', report_name='stock')|tojson }},
      excelUrl: {{ url_for('report_excel', report_name='stock')|tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='js/pages/ds-shell.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pages/yarn-report-stock.js') }}"></script>
</body>
</html>
