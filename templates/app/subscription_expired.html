<!DOCTYPE html>
<html lang="en">
<head>
  {% include "app/_v2_head.html" %}
  <title>Subscription · Khatay Online</title>
</head>
<body>
  <div id="root"></div>
  <script>
    window.__PAGE__ = {
      csrfToken: {{ csrf_token()|tojson }},
      flashes: {{ get_flashed_messages(with_categories=true)|tojson }},
      companyName: {{ company.name|tojson }},
      subscriptionStatus: {{ company.subscription_status|tojson }},
      logoutUrl: {{ url_for('logout')|tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='js/pages/ds-shell.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pages/yarn-subscription-expired.js') }}"></script>
</body>
</html>
