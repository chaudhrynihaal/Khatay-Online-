<!DOCTYPE html>
<html lang="en">
<head>
  {% include "app/_v2_head.html" %}
  <title>Capital &amp; Expense · {{ company_name }}</title>
</head>
<body>
  <div id="root"></div>
  <script>
    window.__PAGE__ = {
      {% include "app/_v2_page_data.html" %}
      today: {{ today|tojson }},
      expenses: {{ expenses|tojson }},
      capital: {{ {"total_in": capital.total_in, "total_out": capital.total_out, "net_capital": capital.net_capital}|tojson }},
      capitalEntries: {{ capital_entries|tojson }},
      savedVoucher: {{ saved_voucher|tojson }},
      printVoucherUrlBase: {{ url_for('print_voucher', transaction_id=0)|tojson }},
      editTransactionUrlBase: {{ url_for('edit_transaction', transaction_id=0)|tojson }},
      deleteTransactionUrlBase: {{ url_for('delete_transaction', transaction_id=0)|tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='js/pages/ds-shell.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pages/yarn-capital-expense.js') }}"></script>
</body>
</html>
