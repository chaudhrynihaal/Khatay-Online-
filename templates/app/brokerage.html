<!DOCTYPE html>
<html lang="en">
<head>
  {% include "app/_v2_head.html" %}
  <title>Brokerage · {{ company_name }}</title>
</head>
<body>
  <div id="root"></div>
  <script>
    window.__PAGE__ = {
      {% include "app/_v2_page_data.html" %}
      brokers: {{ brokers|tojson }},
      brokerFilter: {{ broker_filter|tojson }},
      searchQ: {{ search_q|tojson }},
      groups: {{ groups|tojson }},
      total: {{ total|tojson }},
      summary: {{ summary|tojson }},
      today: {{ today|tojson }},
      payBrokerageUrl: {{ url_for('report_brokerage_pay')|tojson }},
      pdfUrl: {{ url_for('report_pdf', report_name='brokerage')|tojson }},
      excelUrl: {{ url_for('report_excel', report_name='brokerage')|tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='js/pages/ds-shell.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pages/yarn-report-brokerage.js') }}"></script>
</body>
</html>
