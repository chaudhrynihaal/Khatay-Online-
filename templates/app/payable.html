<!DOCTYPE html>
<html lang="en">
<head>
  {% include "app/_v2_head.html" %}
  <title>Payable Ledger · {{ company_name }}</title>
</head>
<body>
  <div id="root"></div>
  <script>
    window.__PAGE__ = {
      {% include "app/_v2_page_data.html" %}
      asOf: {{ as_of|tojson }},
      groups: {{ groups|tojson }},
      total: {{ total|tojson }},
      overdue: {{ overdue|tojson }},
      pdfUrl: {{ url_for('report_pdf', report_name='payable')|tojson }},
      excelUrl: {{ url_for('report_excel', report_name='payable')|tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='js/pages/ds-shell.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pages/yarn-report-payable.js') }}"></script>
</body>
</html>
