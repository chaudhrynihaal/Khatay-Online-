<!DOCTYPE html>
<html lang="en">
<head>
  {% include "app/_v2_head.html" %}
  <title>Inventory · {{ company_name }}</title>
</head>
<body>
  <div id="root"></div>
  <script>
    window.__PAGE__ = {
      {% include "app/_v2_hardware_page_data.html" %}
      items: {{ items|tojson }},
      standardUnits: {{ standard_units|tojson }},
      categories: {{ categories|tojson }},
      parentItems: {{ parent_items|tojson }},
      editItemUrlBase: {{ url_for('hardware_edit_item', item_id=0)|tojson }},
      deleteItemUrlBase: {{ url_for('hardware_delete_item', item_id=0)|tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='js/pages/ds-shell.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pages/hardware-inventory.js') }}"></script>
</body>
</html>
