<!DOCTYPE html>
<html lang="en">
<head>
  {% include "app/_v2_head.html" %}
  <title>Sale Book · {{ company_name }}</title>
</head>
<body>
  <div id="root"></div>
  <script>
    window.__PAGE__ = {
      {% include "app/_v2_hardware_page_data.html" %}
      today: {{ today|tojson }},
      items: {{ items|tojson }},
      customers: {{ customers|tojson }},
      customerPrices: {{ customer_prices|tojson }},
      invoices: {{ invoices|tojson }},
      itemQuickAddUrl: {{ url_for('hardware_item_quick_add')|tojson }},
      customerQuickAddUrl: {{ url_for('hardware_customer_quick_add')|tojson }},
      addCustomerUrl: {{ url_for('hardware_add_customer')|tojson }},
      itemByBarcodeUrl: {{ url_for('hardware_item_by_barcode')|tojson }},
      printUrlBase: {{ url_for('hardware_print_bill', txn_type='SALE', txn_id=0)|tojson }},
      editTxnUrlBase: {{ url_for('hardware_ledger_transaction_edit', txn_id=0)|tojson }},
      deleteTxnUrlBase: {{ url_for('hardware_ledger_transaction_delete', txn_id=0)|tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='js/pages/ds-shell.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pages/hardware-sales.js') }}"></script>
</body>
</html>
