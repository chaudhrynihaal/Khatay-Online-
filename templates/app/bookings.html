<!DOCTYPE html>
<html lang="en">
<head>
  {% include "app/_v2_head.html" %}
  <title>Bookings · {{ company_name }}</title>
</head>
<body>
  <div id="root"></div>
  <script>
    window.__PAGE__ = {
      {% include "app/_v2_page_data.html" %}
      today: {{ today|tojson }},
      searchQ: {{ search_q|tojson }},
      statusFilter: {{ status_filter|tojson }},
      parties: {{ parties|tojson }},
      items: {{ items|tojson }},
      bookings: {{ bookings|tojson }},
      savedVoucher: {{ saved_voucher|tojson }},
      printVoucherUrlBase: {{ url_for('print_voucher', transaction_id=0)|tojson }},
      bookingDetailUrlBase: {{ url_for('booking_detail', booking_id=0)|tojson }},
      deliverBookingUrlBase: {{ url_for('deliver_booking', booking_id=0)|tojson }},
      cancelBookingUrlBase: {{ url_for('cancel_booking', booking_id=0)|tojson }},
      partyQuickAddUrl: {{ url_for('parties_quick_add')|tojson }},
      itemQuickAddUrl: {{ url_for('quality_quick_add')|tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='js/pages/ds-shell.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pages/yarn-bookings.js') }}"></script>
</body>
</html>
