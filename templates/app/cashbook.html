<!DOCTYPE html>
<html lang="en">
<head>
  {% include "app/_v2_head.html" %}
  <title>Cash Book · {{ company_name }}</title>
</head>
<body>
  <div id="root"></div>
  <script>
    window.__PAGE__ = {
      {% include "app/_v2_page_data.html" %}
      dateFrom: {{ date_from|tojson }},
      dateTo: {{ date_to|tojson }},
      t: {{ {"debit_entries": t.debit_entries, "credit_entries": t.credit_entries, "total_debit": t.total_debit, "total_credit": t.total_credit, "opening_balance": t.opening_balance, "closing_balance": t.closing_balance}|tojson }},
      pdfUrl: {{ url_for('report_pdf', report_name='cashbook')|tojson }},
      excelUrl: {{ url_for('report_excel', report_name='cashbook')|tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='js/pages/ds-shell.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pages/yarn-report-cashbook.js') }}"></script>
</body>
</html>
