<!DOCTYPE html>
<html lang="en">
<head>
  {% include "app/_v2_head.html" %}
  <title>Team · {{ company_name }}</title>
</head>
<body>
  <div id="root"></div>
  <script>
    window.__PAGE__ = {
      {% include "app/_v2_page_data.html" %}
      currentUserId: {{ current_user.id|tojson }},
      users: {{ users|tojson }},
      searchQ: {{ search_q|tojson }},
      deleteUserUrlBase: {{ url_for('team_delete_user', user_id=0)|tojson }},
      toggleEditUrlBase: {{ url_for('team_toggle_edit', user_id=0)|tojson }},
      setEmailUrlBase: {{ url_for('team_set_email', user_id=0)|tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='js/pages/ds-shell.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pages/yarn-team.js') }}"></script>
</body>
</html>
