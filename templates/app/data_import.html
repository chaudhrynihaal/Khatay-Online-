<!DOCTYPE html>
<html lang="en">
<head>
  {% include "app/_v2_head.html" %}
  <title>Import Your Existing Data · {{ company_name }}</title>
</head>
<body>
  <div id="root"></div>
  <script>
    window.__PAGE__ = {
      {% include "app/_v2_page_data.html" %}
      partiesTemplateUrl: {{ url_for('data_import_template', kind='parties')|tojson }},
      qualityTemplateUrl: {{ url_for('data_import_template', kind='quality')|tojson }},
      openingEntriesTemplateUrl: {{ url_for('data_import_template', kind='opening_entries')|tojson }},
      importPartiesUrl: {{ url_for('data_import_parties')|tojson }},
      importQualityUrl: {{ url_for('data_import_quality')|tojson }},
      importOpeningEntriesUrl: {{ url_for('data_import_opening_entries')|tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='js/pages/ds-shell.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pages/yarn-data-import.js') }}"></script>
</body>
</html>
