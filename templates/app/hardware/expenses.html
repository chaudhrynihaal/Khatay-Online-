<!DOCTYPE html>
<html lang="en">
<head>
  {% include "app/_v2_head.html" %}
  <title>Expenses · {{ company_name }}</title>
</head>
<body>
  <div id="root"></div>
  <script>
    window.__PAGE__ = {
      {% include "app/_v2_hardware_page_data.html" %}
      today: {{ today|tojson }},
      expenses: {{ expenses|tojson }},
      totalExpenses: {{ total_expenses|tojson }},
      totalSales: {{ total_sales|tojson }},
      netProfit: {{ net_profit|tojson }},
      editExpenseUrlBase: {{ url_for('hardware_edit_expense', expense_id=0)|tojson }},
      deleteExpenseUrlBase: {{ url_for('hardware_expense_delete', expense_id=0)|tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='js/pages/ds-shell.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pages/hardware-expenses.js') }}"></script>
</body>
</html>
