<!DOCTYPE html>
<html lang="en">
<head>
  {% include "app/_v2_head.html" %}
  <title>Ledger · {{ company_name }}</title>
</head>
<body>
  <div id="root"></div>
  <script>
    window.__PAGE__ = {
      {% include "app/_v2_hardware_page_data.html" %}
      today: {{ today|tojson }},
      partyType: {{ party_type|tojson }},
      parties: {{ parties|tojson }},
      partyId: {{ party_id|tojson }},
      ledger: {{ ledger|tojson }},
      paymentUrl: {{ url_for('hardware_ledger_payment')|tojson }},
      editPaymentUrlBase: {{ url_for('hardware_ledger_payment_edit', payment_id=0)|tojson }},
      deletePaymentUrlBase: {{ url_for('hardware_ledger_payment_delete', payment_id=0)|tojson }},
      editTxnUrlBase: {{ url_for('hardware_ledger_transaction_edit', txn_id=0)|tojson }},
      deleteTxnUrlBase: {{ url_for('hardware_ledger_transaction_delete', txn_id=0)|tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='js/pages/ds-shell.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pages/hardware-ledger.js') }}"></script>
</body>
</html>
