<!DOCTYPE html>
<html lang="en">
<head>
  {% include "app/_v2_head.html" %}
  <title>Returns · {{ company_name }}</title>
</head>
<body>
  <div id="root"></div>
  <script>
    window.__PAGE__ = {
      {% include "app/_v2_hardware_page_data.html" %}
      today: {{ today|tojson }},
      returnType: {{ return_type|tojson }},
      items: {{ items|tojson }},
      customers: {{ customers|tojson }},
      suppliers: {{ suppliers|tojson }},
      invoices: {{ invoices|tojson }},
      sourceBills: {{ source_bills|tojson }},
      printUrlBase: {{ url_for('hardware_print_bill', txn_type='SALE_RETURN', txn_id=0)|tojson }},
      purchasePrintUrlBase: {{ url_for('hardware_print_bill', txn_type='PURCHASE_RETURN', txn_id=0)|tojson }},
      editTxnUrlBase: {{ url_for('hardware_ledger_transaction_edit', txn_id=0)|tojson }},
      deleteTxnUrlBase: {{ url_for('hardware_ledger_transaction_delete', txn_id=0)|tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='js/pages/ds-shell.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pages/hardware-returns.js') }}"></script>
</body>
</html>
