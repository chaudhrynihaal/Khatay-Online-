<!DOCTYPE html>
<html lang="en">
<head>
  {% include "app/_v2_head.html" %}
  <title>Sign in · Khatay Online</title>
</head>
<body>
  <div id="root"></div>
  <script>
    window.__PAGE__ = {
      {% include "app/_v2_auth_page_data.html" %}
      alreadySignedIn: {{ already_signed_in|default(none)|tojson }},
      forgotPasswordUrl: {{ url_for('forgot_password')|tojson }},
      dashboardUrl: {{ url_for('dashboard')|tojson }},
      adminDashboardUrl: {{ url_for('admin_dashboard')|tojson }},
      logoutUrl: {{ url_for('logout')|tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='js/pages/ds-shell.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pages/yarn-login.js') }}"></script>
</body>
</html>
