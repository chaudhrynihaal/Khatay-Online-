<!DOCTYPE html>
<html lang="en">
<head>
  {% include "app/_v2_head.html" %}
  <title>Settings · {{ company_name }}</title>
</head>
<body>
  <div id="root"></div>
  <script>
    window.__PAGE__ = {
      {% include "app/_v2_page_data.html" %}
      settingsCompanyName: {{ company_name|tojson }},
      theme: {{ theme|tojson }},
      themes: {{ themes|tojson }},
      openingCashBalance: {{ opening_cash_balance|tojson }},
      openingCashDate: {{ opening_cash_date|tojson }},
      warehouseAddress: {{ warehouse_address|tojson }},
      notificationEmail: {{ notification_email|tojson }},
      logoUrl: {{ (url_for('company_logo', filename=logo_filename) if logo_filename else None)|tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='js/pages/ds-shell.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pages/yarn-settings.js') }}"></script>
</body>
</html>
