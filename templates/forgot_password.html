{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content_bare %}
<div class="login-wrap">
  <div class="login-card">
    <div class="brand">
      <span class="dot"></span>
      <h1>Forgot Password</h1>
      <p class="sub">Enter your username or email and we'll send you a reset link, if we have one on file.</p>
    </div>
    <form method="post">
      <div class="field">
        <label>Username or Email</label>
        <input type="text" name="identifier" autofocus required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:11px;">Send Reset Link</button>
    </form>
    <p style="text-align:center; margin-top:16px; font-size:13px;">
      <a href="{{ url_for('login') }}">Back to sign in</a>
    </p>
  </div>
</div>
{% endblock %}
