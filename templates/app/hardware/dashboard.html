<!DOCTYPE html>
<html lang="en">
<head>
  {% include "app/_v2_head.html" %}
  <title>Dashboard · {{ company_name }}</title>
</head>
<body>
  <div id="root"></div>
  <script>
    window.__PAGE__ = {
      {% include "app/_v2_hardware_page_data.html" %}
      stock: {{ stock|tojson }},
      receivable: {{ receivable|tojson }},
      payable: {{ payable|tojson }},
      salesTodayTotal: {{ sales_today_total|tojson }},
      totalSales: {{ total_sales|tojson }},
      netProfit: {{ net_profit|tojson }},
      cashBalance: {{ cash_balance|tojson }},
      lowStock: {{ low_stock|tojson }},
      expiring: {{ expiring|tojson }},
      openQuotationsCount: {{ open_quotations_count|tojson }},
      taxRate: {{ tax_rate|tojson }},
      gstNumber: {{ gst_number|tojson }},
      taxSettingsUrl: {{ url_for('hardware_tax_settings')|tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='js/pages/ds-shell.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pages/hardware-dashboard.js') }}"></script>
</body>
</html>
