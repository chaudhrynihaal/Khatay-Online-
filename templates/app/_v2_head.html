{# Shared <head> boilerplate for every migrated (React/design-system) Yarn
   screen. Include with {% include "app/_v2_head.html" %} inside <head>,
   then add the page's own <script src=".../pages/yarn-xxx.js"> after
   ds-shell.js at the bottom of <body>. #}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token() }}">
<link rel="manifest" href="{{ url_for('pwa_manifest') }}">
<meta name="theme-color" content="#3b37c0">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="{{ url_for('static', filename='ds/styles.css') }}">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('{{ url_for("pwa_service_worker") }}').catch(function () {});
    });
  }
</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.js"></script>
<script src="{{ url_for('static', filename='ds/ds-bundle.js') }}"></script>
