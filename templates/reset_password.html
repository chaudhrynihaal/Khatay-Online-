{% extends "base.html" %}
{% block title %}Set New Password{% endblock %}
{% block content_bare %}
<div class="login-wrap">
  <div class="login-card">
    <div class="brand">
      <span class="dot"></span>
      <h1>Set a New Password</h1>
      <p class="sub">{{ "For " + username if username else "" }}</p>
    </div>
    <form method="post">
      <div class="field">
        <label>New Password</label>
        <input type="password" name="password" required minlength="6" autofocus>
      </div>
      <div class="field">
        <label>Confirm New Password</label>
        <input type="password" name="confirm" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:11px;">Set Password</button>
    </form>
  </div>
</div>
{% endblock %}
