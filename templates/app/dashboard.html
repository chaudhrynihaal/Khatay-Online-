<!DOCTYPE html>
<html lang="en">
<head>
  {% include "app/_v2_head.html" %}
  <title>Dashboard · {{ company_name }}</title>
</head>
<body>
  <div id="root"></div>
  <script>
    window.__PAGE__ = {
      {% include "app/_v2_page_data.html" %}
      stats: {
        totalReceivable: {{ total_receivable }},
        overdueReceivable: {{ overdue_receivable }},
        totalPayable: {{ total_payable }},
        netProfit: {{ profit.net_profit }},
        partyCount: {{ party_count }},
        itemCount: {{ item_count }},
        receivablePartyCount: {{ receivable_party_count }},
        payablePartyCount: {{ payable_party_count }},
        overduePartyCount: {{ overdue_party_count }}
      }
    };
  </script>
  <script src="{{ url_for('static', filename='js/pages/ds-shell.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pages/yarn-dashboard.js') }}"></script>
</body>
</html>
