<!DOCTYPE html>
<html lang="en">
<head>
  {% include "app/_v2_head.html" %}
  <title>{{ company.name }} · Khatay Admin</title>
</head>
<body>
  <div id="root"></div>
  <script>
    window.__PAGE__ = {
      {% include "app/_v2_admin_page_data.html" %}
      company: {{ company|tojson }},
      users: {{ users|tojson }},
      updateSubscriptionUrl: {{ url_for('admin_update_subscription', company_id=company.id)|tojson }},
      createUserUrl: {{ url_for('admin_create_user', company_id=company.id)|tojson }},
      deleteUserUrlBase: {{ url_for('admin_delete_user', user_id=0)|tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='js/pages/ds-shell.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pages/admin-company-detail.js') }}"></script>
</body>
</html>
