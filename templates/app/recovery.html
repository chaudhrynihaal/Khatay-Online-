<!DOCTYPE html>
<html lang="en">
<head>
  {% include "app/_v2_head.html" %}
  <title>Receipt &amp; Payment · {{ company_name }}</title>
</head>
<body>
  <div id="root"></div>
  <script>
    window.__PAGE__ = {
      {% include "app/_v2_page_data.html" %}
      today: {{ today|tojson }},
      searchQ: {{ search_q|tojson }},
      parties: {{ parties|tojson }},
      recent: {{ recent|tojson }},
      savedVoucher: {{ saved_voucher|tojson }},
      printVoucherUrlBase: {{ url_for('print_voucher', transaction_id=0)|tojson }},
      editTransactionUrlBase: {{ url_for('edit_transaction', transaction_id=0)|tojson }},
      deleteTransactionUrlBase: {{ url_for('delete_transaction', transaction_id=0)|tojson }},
      partyQuickAddUrl: {{ url_for('parties_quick_add')|tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='js/pages/ds-shell.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pages/yarn-recovery.js') }}"></script>
</body>
</html>
