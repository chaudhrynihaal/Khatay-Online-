<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're offline · Khatay</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #f7f5fb; color: #241d30; font-family: -apple-system, "Segoe UI", Inter, sans-serif;
    text-align: center; padding: 24px; box-sizing: border-box;
  }
  .card { max-width: 380px; }
  .dot {
    width: 56px; height: 56px; border-radius: 16px; background: #6f42c1; margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 26px;
  }
  h1 { font-size: 19px; margin: 0 0 8px; }
  p { font-size: 14px; color: #66607a; line-height: 1.5; margin: 0 0 20px; }
  button {
    background: #6f42c1; color: #fff; border: none; border-radius: 8px; padding: 10px 20px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #5b3499; }
</style>
</head>
<body>
  <div class="card">
    <div class="dot">K</div>
    <h1>You're offline</h1>
    <p>This page isn't available without an internet connection. Anything you already had open should still
       work from what's cached, but new sales, purchases, and other entries need a connection to save safely.</p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
