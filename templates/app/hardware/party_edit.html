<!DOCTYPE html>
<html lang="en">
<head>
  {% include "app/_v2_head.html" %}
  <title>Edit {{ party.name }} · {{ company_name }}</title>
</head>
<body>
  <div id="root"></div>
  <script>
    window.__PAGE__ = {
      {% include "app/_v2_hardware_page_data.html" %}
      party: {{ party|tojson }},
      balance: {{ balance|tojson }},
      prices: {{ prices|tojson }},
      items: {{ items|tojson }},
      addPriceUrl: {{ url_for('hardware_add_customer_price', party_id=party.id)|tojson }},
      deletePriceUrlBase: {{ url_for('hardware_delete_customer_price', party_id=party.id, price_id=0)|tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='js/pages/ds-shell.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pages/hardware-party-edit.js') }}"></script>
</body>
</html>
