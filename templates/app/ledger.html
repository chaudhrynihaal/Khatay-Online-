<!DOCTYPE html>
<html lang="en">
<head>
  {% include "app/_v2_head.html" %}
  <title>Party Ledger · {{ company_name }}</title>
</head>
<body>
  <div id="root"></div>
  <script>
    window.__PAGE__ = {
      {% include "app/_v2_page_data.html" %}
      parties: {{ parties|tojson }},
      partyId: {{ party_id|tojson }},
      party: {{ party|tojson }},
      rows: {{ rows|tojson }},
      closingBalance: {{ closing_balance|tojson }},
      totalDebit: {{ total_debit|tojson }},
      totalCredit: {{ total_credit|tojson }},
      pdfUrl: {{ url_for('report_pdf', report_name='ledger')|tojson }},
      excelUrl: {{ url_for('report_excel', report_name='ledger')|tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='js/pages/ds-shell.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pages/yarn-report-ledger.js') }}"></script>
</body>
</html>
