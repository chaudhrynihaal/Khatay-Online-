<!DOCTYPE html>
<html lang="en">
<head>
  {% include "app/_v2_head.html" %}
  <title>Purchase & Sale · {{ company_name }}</title>
</head>
<body>
  <div id="root"></div>
  <script>
    window.__PAGE__ = {
      {% include "app/_v2_page_data.html" %}
      today: {{ today|tojson }},
      searchQ: {{ search_q|tojson }},
      parties: {{ parties|tojson }},
      brokers: {{ brokers|tojson }},
      items: {{ items|tojson }},
      recent: {{ recent|tojson }},
      savedVoucher: {{ saved_voucher|tojson }},
      suggestedDoSale: {{ suggested_do_sale|tojson }},
      suggestedDoPurchase: {{ suggested_do_purchase|tojson }},
      openBookings: {{ open_bookings|tojson }},
      printVoucherUrlBase: {{ url_for('print_voucher', transaction_id=0)|tojson }},
      editTransactionUrlBase: {{ url_for('edit_transaction', transaction_id=0)|tojson }},
      deleteTransactionUrlBase: {{ url_for('delete_transaction', transaction_id=0)|tojson }},
      deliverBookingUrlBase: {{ url_for('deliver_booking', booking_id=0)|tojson }},
      partyQuickAddUrl: {{ url_for('parties_quick_add')|tojson }},
      itemQuickAddUrl: {{ url_for('quality_quick_add')|tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='js/pages/ds-shell.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pages/yarn-transactions.js') }}"></script>
</body>
</html>
