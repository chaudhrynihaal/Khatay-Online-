<!DOCTYPE html>
<html lang="en">
<head>
  {% include "app/_v2_head.html" %}
  <title>Edit {{ party.name }} · {{ company_name }}</title>
</head>
<body>
  <div id="root"></div>
  <script>
    window.__PAGE__ = {
      {% include "app/_v2_page_data.html" %}
      party: {{ party|tojson }},
      openingCount: {{ opening_count }},
      openingTotal: {{ opening_total }},
      deleteUrl: {{ url_for('delete_party', party_id=party.id)|tojson }},
      clearOpeningEntriesUrl: {{ url_for('clear_opening_entries', party_id=party.id)|tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='js/pages/ds-shell.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pages/yarn-edit-party.js') }}"></script>
</body>
</html>
